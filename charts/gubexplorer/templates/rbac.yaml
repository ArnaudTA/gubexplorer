{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterScope }}
# ─── ClusterRole: can list namespaces + manage resources everywhere ───────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gubexplorer.fullname" . }}
  labels:
    {{- include "gubexplorer.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.clusterRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gubexplorer.fullname" . }}
  labels:
    {{- include "gubexplorer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gubexplorer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "gubexplorer.fullname" . }}
  apiGroup: rbac.authorization.k8s.io

{{- else }}
# ─── Namespace-scoped Role ────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gubexplorer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gubexplorer.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gubexplorer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gubexplorer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gubexplorer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "gubexplorer.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}

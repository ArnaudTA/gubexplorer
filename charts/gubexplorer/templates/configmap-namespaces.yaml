{{- if and .Values.rbac.create (not .Values.rbac.clusterScope) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gubexplorer.fullname" . }}-namespaces
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gubexplorer.labels" . | nindent 4 }}
data:
  # Pre-seeded from rbac.candidateNamespaces. Dynamically grown at runtime
  # by the app as the user successfully accesses namespaces.
  accessible: {{ join "\n" .Values.rbac.candidateNamespaces | quote }}
{{- end }}

name: Release

# Triggered automatically when a GitHub Release is published (by release-please
# or manually via the GitHub UI), AND manually via workflow_dispatch from any
# branch.
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 — no leading 'v')"
        required: true
        type: string
      ref:
        description: "Branch, tag or SHA to build from"
        required: false
        default: "main"
        type: string

permissions:
  contents: write   # attach assets to the release
  packages: write   # push to GHCR

jobs:
  # ── Resolve version + checkout ref ────────────────────────────────────────
  setup:
    name: Resolve version & ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
      ref:     ${{ steps.ver.outputs.ref }}
    steps:
      - name: Compute version, tag and ref
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
            REF="${{ github.sha }}"
          else
            RAW="${{ inputs.version }}"
            REF="${{ inputs.ref }}"
          fi
          # Normalise: strip leading 'v' for semver, add it back for git tag
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "ref=${REF}"         >> "$GITHUB_OUTPUT"
          echo "Building version=${VERSION} tag=${TAG} from ref=${REF}"

  # ── Docker image ──────────────────────────────────────────────────────────
  docker:
    name: Build & push Docker image
    needs: setup
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TAG:     ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Helm chart ────────────────────────────────────────────────────────────
  helm:
    name: Package & push Helm chart
    needs: setup
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TAG:     ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package chart
        run: |
          helm package charts/gubexplorer \
            --version  "$VERSION" \
            --app-version "$VERSION"

      - name: Push chart to GHCR (OCI)
        run: |
          helm registry login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          helm push "gubexplorer-${VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      # Attach the packaged chart to the GitHub Release only when this workflow
      # was triggered by an actual release event (not workflow_dispatch).
      - name: Attach chart to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files:    gubexplorer-${{ env.VERSION }}.tgz
